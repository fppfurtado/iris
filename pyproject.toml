[project]
name = "iris"
version = "0.1.0"
description = "Sovereign, read-only agent-context layer: federate context sources and serve them to agents via CLI + MCP."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
iris = "iris.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iris"]
